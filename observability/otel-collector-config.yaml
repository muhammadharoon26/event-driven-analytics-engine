# OpenTelemetry Collector Configuration
# Receives traces from microservices via OTLP and forwards to Grafana Tempo

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # `detailed` prints every attribute of every span to the collector's stdout,
  # which drowns out real errors under load. `basic` logs a per-batch summary.
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]

  telemetry:
    logs:
      level: info

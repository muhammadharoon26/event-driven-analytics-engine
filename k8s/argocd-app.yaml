apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-driven-analytics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/event-driven-analytics-engine.git"
    targetRevision: HEAD
    path: k8s
  destination:
    server: "https://kubernetes.default.svc"
    namespace: analytics-engine
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

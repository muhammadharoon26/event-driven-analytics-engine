apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
    spec:
      containers:
        - name: ingestion-api
          image: event-driven-analytics-ingestion-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: engine-config
            - secretRef:
                name: engine-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
spec:
  selector:
    app: ingestion-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

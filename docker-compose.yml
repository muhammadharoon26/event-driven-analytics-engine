version: '3.8'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.19
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --set auto_create_topics_enabled=true
    ports:
      - "8081:8081"
      - "9092:9092"
      - "29092:29092"

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.19
    container_name: redpanda-init
    depends_on:
      - redpanda
    entrypoint: [ "bash", "-c", "sleep 5 && rpk topic create user-events --brokers redpanda:29092" ]

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-analytics}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  ingestion-api:
    build:
      context: ./ingestion-api
      dockerfile: Dockerfile
    container_name: ingestion-api
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=redpanda:29092
      - KAFKA_TOPIC=user-events
    depends_on:
      - redpanda

  data-processor:
    build:
      context: ./data-processor
      dockerfile: Dockerfile
    container_name: data-processor
    environment:
      - KAFKA_BROKERS=redpanda:29092
      - KAFKA_TOPIC=user-events
      - KAFKA_GROUP_ID=processor-group
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-analytics}
    depends_on:
      - redpanda
      - postgres

volumes:
  pg-data:
